<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>aochat</title>
<link rel="stylesheet" href="style.css?v=cf41468b">
<script>
/* site theme only; the phone preview is never themed */
(function(){var t;try{t=localStorage.getItem('aochat-theme')}catch(e){}
 if(!t)t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
 document.documentElement.setAttribute('data-theme',t)})();
</script>
</head>
<body>
<header>
  <h1>aochat</h1>
  <span style="flex:1"></span>
  <button class="switch" id="theme" role="switch" aria-checked="false" aria-label="Dark mode" title="Dark mode"><span class="trk"></span></button>
</header>
<main>
  <!-- ============ BUILDER ============ -->
  <div class="col" id="build">
    <label class="f">Skin</label>
    <div class="skins" id="skins"></div>
    <label class="f">Messages</label>
    <div id="msgs"></div>
    <button class="add" id="addm">+ Add message</button>
  </div>

  <!-- ============ PREVIEW ============ -->
  <div class="col" id="mid">
    <div class="head"><span>Preview</span><span style="flex:1"></span>
      <button class="hbtn" id="undo" title="Undo (Ctrl/Cmd+Z)" disabled>↶</button>
      <button class="hbtn" id="redo" title="Redo (Ctrl/Cmd+Shift+Z)" disabled>↷</button></div>
    <div class="pvbox" id="pvbox">
      <iframe id="pv" sandbox="allow-scripts" title="AO3 preview"></iframe>
      <div class="zoom" role="group" aria-label="Zoom">
        <button id="zout" aria-label="Zoom out" title="Zoom out">&minus;</button>
        <button id="zval" class="zv" aria-label="Reset zoom to 100%" title="Reset to 100%">100%</button>
        <button id="zin" aria-label="Zoom in" title="Zoom in">+</button>
        <span class="zsep"></span>
        <button id="zfit" aria-label="Fit to preview" title="Fit to preview">&#x2922;</button>
      </div>
    </div>
    <div class="lint" id="lint"></div>
  </div>

  <!-- ============ OUTPUT ============ -->
  <div class="col" id="out">
    <div class="tabs">
      <button class="tab on" data-p="html">HTML</button>
      <button class="tab" data-p="css">CSS</button>
    </div>
    <div class="pane on" id="p-html"><pre id="o-html"></pre></div>
    <div class="pane" id="p-css"><pre id="o-css"></pre></div>
    <div class="copy">
      <button id="cpH">Copy HTML</button><button id="cpC">Copy CSS</button>
    </div>
  </div>
</main>

<script src="app.js?v=cf41468b"></script>
</body>
</html>
