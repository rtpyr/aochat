<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>aochat</title>
<link rel="stylesheet" href="style.css?v=3e779bcb">
<script>
/* site theme only; the phone preview is never themed */
(function(){var t;try{t=localStorage.getItem('aochat-theme')}catch(e){}
 if(!t)t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
 document.documentElement.setAttribute('data-theme',t)})();
</script>
</head>
<body>
<header>
  <h1>aochat</h1>
  <select id="proj" class="proj" aria-label="Project" title="Switch project" disabled></select>
  <div class="hact" id="hact">
    <button class="hbtn txt" data-a="new" title="New project">New</button>
    <button class="hbtn txt" data-a="rename" title="Rename this project">Rename</button>
    <button class="hbtn txt" data-a="dup" title="Duplicate this project">Duplicate</button>
    <button class="hbtn txt danger" data-a="del" title="Delete this project">Delete</button>
    <span class="hsep"></span>
    <button class="hbtn txt" id="pbtn" aria-haspopup="menu" aria-expanded="false" aria-controls="pmenu" title="Export a .json backup">Export <span class="ech"></span></button>
    <button class="hbtn txt" data-a="imp" title="Import a .json backup">Import</button>
  </div>
  <span style="flex:1"></span>
  <span class="savest" id="savest" role="status" aria-live="polite"><i class="dot"></i><span id="savetx">Opening&hellip;</span></span>
  <button class="switch" id="theme" role="switch" aria-checked="false" aria-label="Dark mode" title="Dark mode"><span class="trk"></span></button>
</header>
<div class="pmenu" id="pmenu" role="menu" hidden>
  <button role="menuitem" data-a="exp">This project (.json)</button>
  <button role="menuitem" data-a="expall">All projects (.json)</button>
</div>
<input type="file" id="impf" accept=".json,application/json" hidden>
<div class="notice" id="notice" hidden>
  <span id="noticetx">Your projects are saved only in this browser, on this device &mdash; no account, nothing uploaded or synced. Clearing browser or site data can delete them, so export a backup now and then.</span>
  <button id="nexp">Export backup</button><button id="nok">Got it</button>
</div>
<dialog id="dlg"><form method="dialog">
  <h2 id="dlgT"></h2><p id="dlgP"></p>
  <input id="dlgI" type="text" maxlength="80" autocomplete="off" aria-label="Project name">
  <div class="dact"><button value="ok" id="dlgOk" class="primary">OK</button><button value="cancel" id="dlgNo" formnovalidate>Cancel</button></div>
</form></dialog>
<main>
  <!-- ============ BUILDER ============ -->
  <div class="col" id="build">
    <label class="f">Skin</label>
    <div class="skins" id="skins"></div>
    <label class="f">Messages</label>
    <div id="msgs"></div>
    <button class="add" id="addm">+ Add message</button>
  </div>

  <!-- ============ PREVIEW ============ -->
  <div class="col" id="mid">
    <div class="head"><span>Preview</span><span style="flex:1"></span>
      <div class="zoom" role="group" aria-label="Zoom">
        <button id="zout" aria-label="Zoom out" title="Zoom out">&minus;</button>
        <button id="zval" class="zv" aria-label="Reset zoom to 100%" title="Reset to 100%">100%</button>
        <button id="zin" aria-label="Zoom in" title="Zoom in">+</button>
      </div>
      <span class="hsep"></span>
      <button class="hbtn" id="undo" title="Undo (Ctrl/Cmd+Z)" disabled>↶</button>
      <button class="hbtn" id="redo" title="Redo (Ctrl/Cmd+Shift+Z)" disabled>↷</button></div>
    <div class="pvbox" id="pvbox">
      <iframe id="pv" sandbox="allow-scripts" title="AO3 preview"></iframe>
    </div>
    <div class="lint" id="lint"></div>
  </div>

  <!-- ============ OUTPUT ============ -->
  <div class="col" id="out">
    <div class="tabs">
      <button class="tab on" data-p="html">HTML</button>
      <button class="tab" data-p="css">CSS</button>
    </div>
    <div class="pane on" id="p-html"><pre id="o-html"></pre></div>
    <div class="pane" id="p-css"><pre id="o-css"></pre></div>
    <div class="copy">
      <button id="cpH">Copy HTML</button><button id="cpC">Copy CSS</button>
    </div>
  </div>
</main>

<script src="store.js?v=3e779bcb"></script>
<script src="app.js?v=3e779bcb"></script>
</body>
</html>
