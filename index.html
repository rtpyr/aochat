<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>aochat</title>
<link rel="stylesheet" href="style.css?v=2c897e1b">
<script>
/* site theme only; the phone preview is never themed */
(function(){var t;try{t=localStorage.getItem('aochat-theme')}catch(e){}
 if(!t)t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
 document.documentElement.setAttribute('data-theme',t)})();
</script>
</head>
<body data-view="edit">
<header>
  <h1>aochat</h1>
  <select id="proj" class="proj" aria-label="Project" title="Switch project" disabled></select>
  <div class="hact" id="hact" role="toolbar" aria-label="Project actions">
    <button class="cmd" data-a="new" title="New project"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3.5v11M3.5 9h11"/></svg><span>New</span></button>
    <button class="cmd" data-a="rename" title="Rename this project"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 14.5l.8-3.3 7.6-7.6a1.4 1.4 0 012 0l.5.5a1.4 1.4 0 010 2l-7.6 7.6-3.3.8z"/><path d="M10.8 4.8l2.4 2.4"/></svg><span>Rename</span></button>
    <button class="cmd" data-a="dup" title="Duplicate this project"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="6.5" width="8.5" height="8.5" rx="2"/><path d="M11.5 6.5V5.5a2 2 0 00-2-2h-4a2 2 0 00-2 2v4a2 2 0 002 2h1"/></svg><span>Duplicate</span></button>
    <button class="cmd danger" data-a="del" title="Delete this project"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 5h11M7 5V3.5h4V5M5 5l.7 9.5h6.6L13 5M7.5 8v4M10.5 8v4"/></svg><span>Delete</span></button>
    <span class="hsep"></span>
    <button class="cmd" id="pbtn" aria-haspopup="menu" aria-expanded="false" aria-controls="pmenu" title="Export a .json backup"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11V3.5M6 6.2l3-2.7 3 2.7M3.5 11v3.5h11V11"/></svg><span>Export <i class="ech"></i></span></button>
    <button class="cmd" data-a="imp" title="Import a .json backup"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3.5V11M6 8.3l3 2.7 3-2.7M3.5 11v3.5h11V11"/></svg><span>Import</span></button>
  </div>
  <span style="flex:1"></span>
  <span class="savest" id="savest" role="status" aria-live="polite"><i class="dot"></i><span id="savetx">Opening&hellip;</span></span>
  <button class="switch" id="theme" role="switch" aria-checked="false" aria-label="Dark mode" title="Dark mode"><span class="trk"></span></button>
</header>
<div class="pmenu" id="pmenu" role="menu" hidden>
  <button role="menuitem" data-a="exp">This project (.json)</button>
  <button role="menuitem" data-a="expall">All projects (.json)</button>
</div>
<input type="file" id="impf" accept=".json,application/json" hidden>
<div class="notice" id="notice" hidden>
  <span id="noticetx">Your projects are saved only in this browser, on this device &mdash; no account, nothing uploaded or synced. Clearing browser or site data can delete them, so export a backup now and then.</span>
  <button id="nexp">Export backup</button><button id="nok">Got it</button>
</div>
<dialog id="dlg"><form method="dialog">
  <h2 id="dlgT"></h2><p id="dlgP"></p>
  <input id="dlgI" type="text" maxlength="80" autocomplete="off" aria-label="Project name">
  <div class="dact"><button value="ok" id="dlgOk" class="primary">OK</button><button value="cancel" id="dlgNo" formnovalidate>Cancel</button></div>
</form></dialog>
<main>
  <!-- ============ BUILDER ============ -->
  <div class="col" id="build">
    <label class="f">Skin</label>
    <div class="skins" id="skins"></div>
    <label class="f">Messages</label>
    <div id="msgs"></div>
    <button class="add" id="addm">+ Add message</button>
  </div>

  <!-- ============ PREVIEW ============ -->
  <div class="col" id="mid">
    <div class="head"><span>Preview</span><span style="flex:1"></span>
      <div class="zoom" role="group" aria-label="Zoom">
        <button id="zout" aria-label="Zoom out" title="Zoom out">&minus;</button>
        <button id="zval" class="zv" aria-label="Reset zoom to 100%" title="Reset to 100%">100%</button>
        <button id="zin" aria-label="Zoom in" title="Zoom in">+</button>
      </div>
      <span class="hsep"></span>
      <button class="hbtn" id="undo" title="Undo (Ctrl/Cmd+Z)" disabled>↶</button>
      <button class="hbtn" id="redo" title="Redo (Ctrl/Cmd+Shift+Z)" disabled>↷</button></div>
    <div class="pvbox" id="pvbox">
      <iframe id="pv" sandbox="allow-scripts" title="AO3 preview"></iframe>
    </div>
    <div class="lint" id="lint"></div>
  </div>

  <!-- ============ OUTPUT ============ -->
  <div class="col" id="out">
    <div class="tabs">
      <button class="tab on" data-p="html">HTML</button>
      <button class="tab" data-p="css">CSS</button>
    </div>
    <div class="pane on" id="p-html"><pre id="o-html"></pre></div>
    <div class="pane" id="p-css"><pre id="o-css"></pre></div>
    <div class="copy">
      <button id="cpH">Copy HTML</button><button id="cpC">Copy CSS</button>
    </div>
  </div>
</main>

<nav id="mtabs" aria-label="Sections">
  <button data-v="edit" class="on" aria-pressed="true"><svg width="20" height="20" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 14.5l.8-3.3 7.6-7.6a1.4 1.4 0 012 0l.5.5a1.4 1.4 0 010 2l-7.6 7.6-3.3.8z"/><path d="M10.8 4.8l2.4 2.4"/></svg><span>Edit</span></button>
  <button data-v="preview" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="1.8" width="9" height="14.4" rx="2"/><path d="M8 13.8h2"/></svg><span>Preview</span></button>
  <button data-v="code" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 5L2.5 9l4 4M11.5 5l4 4-4 4"/></svg><span>Code</span></button>
</nav>
<script src="store.js?v=2c897e1b"></script>
<script src="app.js?v=2c897e1b"></script>
</body>
</html>
